<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ashta Chamma</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- HOME SCREEN -->
    <div id="homeScreen" class="screen">
        <h1 class="game-title">అష్టా చమ్మా</h1>
        <div class="menu-container">
            <button id="playLocalBtn" class="menu-btn primary">📱 PLAY LOCAL (HOTSEAT)</button>
            <div class="online-section">
                <button id="hostBtn" class="menu-btn host-btn">🌐 CREATE ONLINE ROOM</button>
                <div class="join-box">
                    <input type="text" id="joinIdInput" placeholder="Enter Room ID" autocomplete="off">
                    <button id="joinBtn" class="menu-btn join-btn">JOIN</button>
                </div>
            </div>
            <p id="connectionStatus"></p>
            <div id="roomCodeContainer" class="hidden">
                <p>Your Room ID:</p>
                <h3 id="roomCodeDisplay"></h3>
                <button id="copyRoomBtn" class="small-btn">📋 Copy</button>
                <p class="waiting-text">Waiting for opponent...</p>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="screen hidden">
        <div class="game-header">
            <button id="backBtn" class="icon-btn">←</button>
            <h2 class="small-title">Ashta Chamma</h2>
            <button id="soundToggleBtn" class="icon-btn">🔊</button>
        </div>

        <div class="score-bars">
            <div id="p1-bar" class="player-bar p1">
                <span class="dot"></span> PLAYER 1
                <br><span id="p1-home">0/6 Home</span>
                <br><span id="p1-kill" class="kill-badge locked">⚔️ Kill: NO</span>
            </div>
            <div id="p2-bar" class="player-bar p2">
                PLAYER 2 <span class="dot"></span>
                <br><span id="p2-home">0/6 Home</span>
                <br><span id="p2-kill" class="kill-badge locked">⚔️ Kill: NO</span>
            </div>
        </div>

        <div class="status-bar">
            <h3 id="turnText">Player 1's Turn</h3>
            <p id="actionText">Throw the sticks</p>
        </div>

        <!-- ROTATING PLAY AREA -->
        <div id="boardAndYards" class="board-and-yards">
            <div id="p2-yard" class="yard horizontal p2-yard"></div>
            <div class="board-container">
                <div id="board" class="board"></div>
            </div>
            <div id="p1-yard" class="yard horizontal p1-yard"></div>
        </div>

        <!-- Controls Row -->
        <div class="controls-row">
            <div id="p1-stick-box" class="stick-box p1-box active">
                <p class="stick-label">PLAYER 1 STICKS</p>
                <div class="sticks-wrapper" id="sticksWrapper1">
                    <div class="stick p1-stick" data-stick="1"><div class="stick-pips"></div></div>
                    <div class="stick p1-stick" data-stick="2"><div class="stick-pips"></div></div>
                </div>
            </div>

            <div class="center-controls">
                <button id="throwBtn" class="action-btn throw-btn">🪵 THROW STICKS</button>
                <div class="throw-result-display">
                    <span id="resultValue">?</span>
                    <span id="resultName">Ready</span>
                </div>
            </div>

            <div id="p2-stick-box" class="stick-box p2-box">
                <p class="stick-label">PLAYER 2 STICKS</p>
                <div class="sticks-wrapper" id="sticksWrapper2">
                    <div class="stick p2-stick" data-stick="1"><div class="stick-pips"></div></div>
                    <div class="stick p2-stick" data-stick="2"><div class="stick-pips"></div></div>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <button id="newGameBtn" class="text-btn">🔄 New Game</button>
            <span id="systemMsg">Game started!</span>
        </div>
    </div>

    <!-- AUDIO SCRIPT -->
    <script>
        const Sound = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            enabled: true,
            playNoise(dur, freq, type='square') {
                if(!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq/2, this.ctx.currentTime + dur);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + dur);
            },
            playWoodClick() { this.playNoise(0.1, 800, 'square'); },
            playThrowSound() { 
                if(!this.enabled) return;
                setTimeout(() => this.playWoodClick(), 0);
                setTimeout(() => this.playWoodClick(), 150);
                setTimeout(() => this.playWoodClick(), 300);
            },
            playMoveSound() { this.playNoise(0.1, 400, 'sine'); },
            playCaptureSound() { this.playNoise(0.3, 150, 'sawtooth'); },
            playHomeSound() { this.playNoise(0.5, 600, 'sine'); setTimeout(()=>this.playNoise(0.5, 800, 'sine'), 200); },
            playTurnSound() { this.playNoise(0.2, 500, 'triangle'); },
            playWinSound() { this.playNoise(1.5, 800, 'sine'); }
        };
    </script>
    <script src="js/multiplayer.js"></script>
    <script src="js/sticks.js"></script>
    <script src="js/board.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
